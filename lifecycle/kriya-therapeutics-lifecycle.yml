  note: >-
    The version namespace is set by WordPress core, not by Kriya Therapeutics. The site's REST index
    lists every registered namespace — oembed/1.0, wpe/cache-plugin/v1, wpe_sign_on_plugin/v1,
    cookie-notice/v1, gutena-forms/v1, wordfence/v1, yoast/v1, wp/v2, wp-site-health/v1,
    wp-block-editor/v1, wp-abilities/v1 — so a consumer can detect namespace changes by polling
