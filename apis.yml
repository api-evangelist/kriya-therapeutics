aid: kriya-therapeutics
name: Kriya Therapeutics
description: >-
  Kriya Therapeutics, Inc. is a clinical-stage biopharmaceutical company founded in 2019 that
  designs, develops and manufactures one-time AAV gene therapies for chronic diseases that affect
  large patient populations, rather than for ultra-rare indications alone. It is headquartered at
  1219 Shiloh Glenn Drive in Durham, North Carolina, inside Research Triangle Park, with additional
  operations in Palo Alto, California, and has raised more than $900 million across Series A ($80M,
  2020), Series B ($100M, 2021), Series C (over $430M including a $150M extension, 2022-2023) and
  Series D ($320M, September 2025). Its pipeline spans three therapeutic areas: ophthalmology
  (geographic atrophy, thyroid eye disease including KRIYA-586), metabolic disease (Type 1 diabetes,
  MASH/NASH, an investigational AAV-FGF21 program) and neurology (trigeminal neuralgia, added
  through the 2022 acquisition of Redpin Therapeutics). The company operates a vertically integrated
  engine that pairs computational product design with in-house GMP manufacturing — the same unit
  operations from 1L research scale through 50L, 500L and 3,000L bioreactor scale, with Akta
  chromatography purification, vial filling and in-house analytical characterization of critical
  quality attributes. It was selected for the FDA PreCheck Pilot Program in June 2026. Kriya
  Therapeutics runs no developer program and publishes no product API, no developer portal and no
  API documentation; the only machine-readable surface reachable without credentials is the
  WordPress REST content API behind kriyatherapeutics.com, catalogued here.
