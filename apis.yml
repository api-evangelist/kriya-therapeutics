apis:
- aid: kriya-therapeutics:kriya-therapeutics-content-api
  name: Kriya Therapeutics Content API
  description: >-
    The anonymously readable WordPress REST API behind kriyatherapeutics.com. It exposes the
    company's 28-item `news` custom post type (the full press-release archive back to the May 2020
    Series A announcement, individually addressable and filterable by date), 33 blog posts, the 18
    published corporate and pipeline pages (Home, Pipeline, Ophthalmology, Metabolic Disease,
    Neurology, Product Design, Research & Development, Platform, Team, News, Careers, Connect, Site
    Map, Privacy Policy, Terms of Use, Data Privacy Terms, Data Notice), a 304-item media library,
    the `category` and `teamkeywords` taxonomies, registered post types, taxonomies and statuses,
    cross-content search across 58 indexed objects, and the oEmbed 1.0 provider endpoint. The
    `team` custom post type and the `newscategories` taxonomy are registered and reachable but
    currently return zero items. This is not a developer product Kriya Therapeutics markets; it is
    the site's own content surface, registered at /wp-json/ and verified to return data without
    credentials on 2026-08-04. The OpenAPI in this repo is derived from the published route index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://kriyatherapeutics.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - news
  - media
  properties:
  - type: OpenAPI
    url: openapi/kriya-therapeutics-content-openapi.yml
  - type: Overlay
    url: overlays/kriya-therapeutics-content-overlay.yaml
  - type: Authentication
    url: authentication/kriya-therapeutics-authentication.yml
  - type: ErrorCatalog
    url: errors/kriya-therapeutics-problem-types.yml
  - type: Conventions
    url: conventions/kriya-therapeutics-conventions.yml
  - type: DataModel
    url: data-model/kriya-therapeutics-data-model.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://kriyatherapeutics.com/wp-json/ — 227 routes across the namespaces
    oembed/1.0, wpe/cache-plugin/v1, wpe_sign_on_plugin/v1, cookie-notice/v1, gutena-forms/v1,
    wordfence/v1, yoast/v1, wp/v2, wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1 — and
    verified against live anonymous responses on 2026-08-04. Only operations that returned data
    without credentials are modelled. The site registers the WordPress Abilities API
    (`wp-abilities/v1`), an agent-facing capability registry with a /run execution endpoint, but
    every route under it returns 401 rest_forbidden anonymously, so no agent surface is claimed
    here. /wp/v2/settings, /wp/v2/users, /wp/v2/themes, /wp/v2/plugins, /wp/v2/menus,
    /wp/v2/block-types, gutena-forms/v1/*, yoast/v1/*, wordfence/v1/* and wp-site-health/v1/* all
    return 401 anonymously. Kriya Therapeutics publishes no developer documentation, no API
    reference, no getting-started guide and no support channel for this surface, so no
    Documentation/APIReference/GettingStarted pointers are emitted; the humanURL above is the
    upstream WordPress REST handbook that defines the wp/v2 contract.
