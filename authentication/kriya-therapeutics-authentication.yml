    'Authorization, X-WP-Nonce, Content-Disposition, Content-MD5, Content-Type'. Not usable by a
    third-party integrator.
  sources: [https://kriyatherapeutics.com/wp-json/wp/v2/posts]
- name: authorization-header
  type: http
