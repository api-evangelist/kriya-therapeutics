- status: 401
  code: rest_forbidden_context
  title: Authorization header format is invalid.
  observed_at: /wordfence/v1/scan/issues
  observed_body:
    code: rest_forbidden_context
    message: Authorization header format is invalid.
    data:
      status: 401
  remediation: >-
    The Wordfence security-plugin namespace is registered and credential-gated. Its message differs
    from the generic rest_forbidden because it parses the Authorization header before rejecting.
  gated: true
