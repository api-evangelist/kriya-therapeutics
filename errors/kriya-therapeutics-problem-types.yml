method: probed
source: live error responses from https://kriyatherapeutics.com/wp-json/ observed 2026-08-04
format: wordpress-rest-error
rfc9457: false
note: >-
  The Kriya Therapeutics Content API does not use RFC 9457 problem+json. It returns the WordPress
  REST error envelope as application/json — except at the edge, where an unknown object id or an
  unknown route is answered with an nginx HTML 404 page instead. Every entry below was observed live
  against kriyatherapeutics.com — none is inferred from the WordPress source or from documentation.
  Kriya Therapeutics publishes no error reference of its own.
envelope:
  media_type: application/json
  fields:
    code: Machine-readable error slug, stable across WordPress versions.
    message: Human-readable, localised message.
    data.status: The HTTP status code, repeated in the body.
    data.params: Present on validation failures — a map of parameter name to the specific violation.
    data.details: Present on validation failures — per-parameter {code, message, data} objects.
problems:
- status: 400
  code: rest_invalid_param
  title: Invalid parameter(s)
  observed_at: /wp/v2/posts?per_page=200
  observed_body:
    code: rest_invalid_param
    message: 'Invalid parameter(s): per_page'
    data:
      status: 400
      params:
        per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
  remediation: >-
    Read data.params for the offending parameter and data.details[param].code for the specific
    violation class (rest_out_of_bounds, rest_invalid_type, rest_not_in_enum). Correct the value and
    retry — the request is deterministic and safe to repeat.
  source_operation: openapi/kriya-therapeutics-content-openapi.yml#listPosts
  applies_to: [listNews, listPosts, listPages, listMedia, listCategories, listTags, listTeamKeywords, searchContent]
- status: 404
  code: null
  title: nginx 404 (edge, not WordPress)
  observed_at: /wp/v2/posts/999999 and /wp/v2/nonexistent
  observed_body_media_type: text/html
  observed_body: '<html><head><title>404 Not Found</title></head><body><center><h1>404 Not Found</h1></center><hr><center>nginx</center></body></html>'
  remediation: >-
    THE TRAP ON THIS DEPLOYMENT. An unknown object id does NOT produce the usual WordPress
    `rest_post_invalid_id` JSON envelope — the WP Engine edge intercepts it and returns an HTML 404.
    A client that assumes every response body is JSON will throw a parse error rather than see a
    clean 404. Always branch on the Content-Type header before parsing. Resolve ids from the
    collection endpoints or from searchContent rather than constructing them.
  source_operation: openapi/kriya-therapeutics-content-openapi.yml#getPost
  applies_to: [getNewsItem, getPost, getPage, getMediaItem, getCategory, getTeamKeyword]
- status: 401
  code: rest_forbidden
  title: Sorry, you are not allowed to do that.
  observed_at: /wp/v2/settings, /wp-abilities/v1/abilities, /wp-abilities/v1/categories, /gutena-forms/v1/settings, /yoast/v1/statistics, /wp-site-health/v1/tests/https-status
  observed_body:
    code: rest_forbidden
    message: Sorry, you are not allowed to do that.
    data:
      status: 401
  remediation: >-
    The route requires an authenticated principal. Kriya Therapeutics advertises no authentication
    method at all (the REST index `authentication` array is empty) and does not issue credentials to
    third parties, so these routes are not reachable by an integrator. Note the status is 401 with no
    WWW-Authenticate challenge header.
  gated: true
- status: 401
  code: rest_user_cannot_view
  title: Sorry, you are not allowed to list users.
  observed_at: /wp/v2/users
  observed_body:
    code: rest_user_cannot_view
    message: Sorry, you are not allowed to list users.
    data:
      status: 401
  remediation: >-
    Author records are gated on this deployment, unlike WordPress core defaults. The integer `author`
    field on posts, pages and news therefore cannot be resolved to a name by an anonymous caller —
    treat it as an opaque id.
  gated: true
